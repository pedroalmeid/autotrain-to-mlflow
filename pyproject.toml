[project]
name = "autotrain-to-mlflow"
version = "0.1.0"
description = "Proof of Concept evaluating PyCaret AutoML integration with MLflow Tracking and Model Registry"
authors = [
    {name = "Pedro Almeida", email = "pedrojos.campos@protonmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "pycaret (>=3.3.2,<4.0.0)",
    "mlflow (>=2.8,<2.9)",
    "streamlit (>=1.47.0,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
