services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.8.1
    container_name: autotrain_mlflow
    restart: unless-stopped
    ports:
      - "8222:5000"
    volumes:
      - ./mlruns:/mlruns
      - ./mlartifacts:/mlartifacts
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --default-artifact-root /mlartifacts

  app:
    build: .
    container_name: autotrain_streamlit
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - USE_GPU=false
    depends_on:
      - mlflow

